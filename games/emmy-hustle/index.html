<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#141830" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23ffc43d' stroke='%23141830' stroke-width='8'/%3E%3C/svg%3E"
    />
    <title>Emmy's Hustle</title>
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>

      <!-- Soft navy vignette + warm light from the top-left (see style.css) -->
      <div id="vignette"></div>

      <div id="hud">
        <header class="hud-bar">
          <h1 class="hud-title">Emmy's <span>Hustle</span></h1>
          <div class="hud-right">
            <div class="hud-money" id="hud-money" aria-label="Emmy's money">
              <span class="hud-money-icon">&#8358;</span>
              <span id="hud-money-value">0</span>
            </div>
            <!-- Gear button is mounted here by SettingsPanel -->
            <div id="settings-root"></div>
          </div>
        </header>
        <p id="hud-message" class="hud-message" role="status"></p>
      </div>

      <!-- Host for the virtual joystick -->
      <div id="touch-controls" hidden></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
